<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#c9d1d9;
    --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --err:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;letter-spacing:.14em;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok)} .dot.busy{background:var(--warn);animation:p 1s infinite}
  @keyframes p{50%{opacity:.25}}
  .meta{margin-left:auto;font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .m{max-width:78%;padding:9px 13px;border-radius:11px;white-space:pre-wrap;word-break:break-word}
  .u{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:3px}
  .a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
  .sys{align-self:center;font-size:12px;color:var(--dim);background:transparent;padding:2px 8px}
  .sys.err{color:var(--err)} .sys.warn{color:var(--warn)}
  .m .tools{display:block;margin-top:6px;font-size:11px;color:var(--dim)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;max-height:140px;min-height:42px}
  textarea:focus{outline:none;border-color:var(--acc)}
  button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){border-color:var(--acc)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.rec{background:var(--err);border-color:var(--err);color:#fff}
  button.rec.on{animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .row .hint{font-size:11px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>JARVIS</h1>
  <div class="meta">
    <span id="model">–</span><span id="tools">–</span><span id="stt">–</span>
  </div>
</header>

<div id="log"></div>

<footer>
  <div class="row">
    <textarea id="ta" rows="1" placeholder="Nachricht – Enter zum Senden, Shift+Enter für neue Zeile"></textarea>
    <button id="mic" title="Push-to-Talk">●</button>
    <button id="send">Senden</button>
  </div>
  <div class="hint">● gedrückt halten und sprechen · <b>/memory</b> zeigt dein Gedächtnis · <b>/tools</b> zeigt Werkzeuge</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const log = $('log');
const ta = $('ta');
let ws = null, sending = false;

const token = new URLSearchParams(location.search).get('token') || '';
const auth = h => { if (token) h['X-Auth-Token'] = token; return h; };

function add(cls, text, sub) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  if (sub) { const s = document.createElement('span'); s.className = 'tools'; s.textContent = sub; d.appendChild(s); }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function sys(text, kind) { add('sys' + (kind ? ' ' + kind : ''), text); }

function busy(on) {
  sending = on;
  $('dot').className = 'dot' + (on ? ' busy' : ' on');
  $('send').disabled = on;
  $('mic').disabled = on;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws` + (token ? `?token=${encodeURIComponent(token)}` : '');
  ws = new WebSocket(url);

  ws.onopen = () => { $('dot').className = 'dot on'; };
  ws.onclose = () => {
    $('dot').className = 'dot';
    sys('Verbindung getrennt, neuer Versuch in 2 s …', 'warn');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'reply') {
      const sub = m.tool_runs ? `${m.tool_runs} Werkzeugaufruf(e) · ${m.model} · ${m.ms} ms` : `${m.model} · ${m.ms} ms`;
      add('a', m.text, sub);
      if (m.pending) sys(`Warte auf Bestätigung für ${m.pending} – tippe "ja" oder "nein"`, 'warn');
      if (m.error) sys(m.error, 'err');
      busy(false);
    } else if (m.type === 'thinking') {
      add('u', m.text);
      busy(true);
    } else if (m.type === 'error') {
      sys(m.text, 'err');
      busy(false);
    }
  };
}

function send(text) {
  text = text.trim();
  if (!text || sending) return;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'chat', text }));
    ta.value = ''; ta.style.height = 'auto';
  } else {
    sys('Nicht verbunden.', 'err');
  }
}

ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(ta.value); }
});
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; });
$('send').onclick = () => send(ta.value);

// --- Push-to-Talk ----------------------------------------------------------
// MediaRecorder, kein WebSocket-Audio. Der komplette Audio-Stream waere auf
// einem CT mit 2 CPU-Kernen der teuerste Teil des Systems.
let rec = null, chunks = [];
$('mic').addEventListener('pointerdown', async () => {
  if (!navigator.mediaDevices?.getUserMedia) { sys('Kein Mikrofon-Zugriff.', 'err'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $('mic').classList.remove('rec', 'on');
      const blob = new Blob(chunks, { type: 'audio/webm' });
      if (blob.size < 1200) return;
      await transcribe(blob);
    };
    rec.start();
    $('mic').classList.add('rec', 'on');
  } catch (err) {
    sys('Mikrofon: ' + err.message, 'err');
  }
});
const stopRec = () => { if (rec && rec.state !== 'inactive') rec.stop(); };
$('mic').addEventListener('pointerup', stopRec);
$('mic').addEventListener('pointerleave', stopRec);

async function transcribe(blob) {
  const fd = new FormData();
  fd.append('audio', blob, 'audio.webm');
  sys('Transkribiere …');
  try {
    const r = await fetch('/api/stt', { method: 'POST', headers: auth({}), body: fd });
    const j = await r.json();
    if (!r.ok) { sys(j.detail || 'STT fehlgeschlagen.', 'err'); return; }
    ta.value = j.text;
    send(j.text);
  } catch (err) {
    sys('STT: ' + err.message, 'err');
  }
}

// --- Status ----------------------------------------------------------------
(async () => {
  try {
    const h = { };
    const r = await fetch('/api/status', { headers: auth(h) });
    if (!r.ok) { sys('Status nicht abrufbar (Auth?).', 'warn'); return; }
    const s = await r.json();
    $('model').textContent = (s.modelle || []).map(m => m.split('/').pop()).join(' → ');
    $('tools').textContent = `${s.tools?.enabled ?? 0} Werkzeuge`;
    $('stt').textContent = s.stt ? 'Sprache an' : 'Sprache aus';
    $('mic').title = s.stt ? 'Push-to-Talk' : 'STT ist nicht konfiguriert';
    if (!s.stt) $('mic').disabled = true;
    if (!s.tools?.enabled) sys('Keine Werkzeuge registriert – Import von jarvis.tools fehlt?', 'warn');
    sys('Bereit. Frag mich nach deinem Proxmox.');
  } catch (err) {
    sys('Status: ' + err.message, 'err');
  }
})();

connect();
ta.focus();
</script>
</body>
</html>
