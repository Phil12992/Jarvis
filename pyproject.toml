[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal agent harness. Runs on a 3 GB LXC container on Proxmox."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-telegram-bot>=21.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.17",
    "apscheduler>=3.10",
    "structlog>=24.4",
]

[project.optional-dependencies]
# TTS ist optional, weil onnxruntime ~200 MB zieht. Auf einem CT mit
# 3 GB willst du den erst installieren, wenn Telegram-Text wirklich steht.
tts = ["piper-tts>=1.3"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",  # assert ist in tests ok
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
